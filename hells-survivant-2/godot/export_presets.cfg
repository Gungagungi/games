[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="version.txt"
exclude_filter=""
export_path="../index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Mono-thread : évite SharedArrayBuffer, donc les en-têtes COOP/COEP que
; GitHub Pages ne sait pas servir.
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Mobile : plein écran et paysage au premier toucher (Android), lancement
; sans barres de Safari depuis l'écran d'accueil (iPhone). Commentaire en « ; » :
; une ligne « # » avale la clé qui la suit.
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\"><script>addEventListener(\"touchend\",function(){var d=document.documentElement;try{var p=d.requestFullscreen&&d.requestFullscreen();if(p&&p.then)p.then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock(\"landscape\").catch(function(){});}).catch(function(){});}catch(e){}},{once:true});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.102, 0.02, 0.02, 1)
